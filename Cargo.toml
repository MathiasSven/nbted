[package]
name = "nbted"
version = "1.5.2"
authors = ["C4K3 <crates.io@c4k3.net>"]
build = "build.rs"
repository = "https://github.com/C4K3/nbted"
description = "Command-line NBT editor"
license = "CC0-1.0"
keywords = ["nbt"]
categories = ["command-line-utilities"]
edition = "2024"

[dependencies]
byteorder = "1"
flate2 = "1"
getopts = "0.2"
tempfile = "3"
anyhow = "1"
serde_json = "1"

[build-dependencies]
vergen-git2 = { version = "9" }

[dev-dependencies]
datatest-stable = "0.3"

[[test]]
name = "datatest"
harness = false
